<!-- MediLab X 10.1.3: compact Rate List shortcut above left sidebar footer; all original event handlers retained. -->
<style id="mlx1013-bottom-rates-css">
@media screen {html body.mlx101-ui[data-mlx101-mode="dark"]{--mx12-active:#25466b!important;}}
@media screen {
/* Hide only the duplicate historical nav affordance. Its DOM and click handler remain available for fallback. */
html body.mlx101-ui.mlx110-ui #app #nav button[data-page="ratelist"],
html.medilab-desktop body.mlx101-ui.mlx110-ui #app #nav button[data-page="ratelist"] {
 display:none!important;visibility:hidden!important;
}
html body.mlx101-ui #app .sidebar .mlx1013-rates-dock {
 display:flex!important;align-items:center!important;justify-content:center!important;gap:8px!important;
 width:calc(100% - 10px)!important;min-height:34px!important;max-height:36px!important;
 margin:7px 5px!important;padding:7px 10px!important;flex:0 0 auto!important;
 border:1px solid #587397!important;border-radius:7px!important;
 background:#253e62!important;background-image:none!important;color:#f2f7ff!important;
 font:600 12px/1.2 'Segoe UI Variable Text','Segoe UI',Arial,sans-serif!important;
 box-shadow:none!important;text-shadow:none!important;filter:none!important;cursor:pointer!important;
 transition:background-color .16s ease,border-color .16s ease,transform .16s ease!important;
}
html body.mlx101-ui #app .sidebar .mlx1013-rates-dock:hover {
 background:#33577e!important;border-color:#8cadd5!important;transform:translateY(-1px)!important;
}
html body.mlx101-ui #app .sidebar .mlx1013-rates-dock:focus-visible {
 outline:2px solid #a6d0ff!important;outline-offset:1px!important;
}
html body.mlx101-ui #app .sidebar .mlx1013-rates-dock svg {
 display:block!important;flex:none!important;width:16px!important;height:16px!important;
 stroke:currentColor!important;fill:none!important;stroke-width:1.85!important;
 stroke-linejoin:round!important;stroke-linecap:round!important;
}
html body.mlx101-ui #app .sidebar .sidebar-foot {flex:0 0 auto!important;}
@media(max-width:900px){
 html body.mlx101-ui #app .sidebar .mlx1013-rates-dock{width:calc(100% - 6px)!important;padding:7px 2px!important;margin:6px 3px!important;font-size:0!important;gap:0!important;}
 html body.mlx101-ui #app .sidebar .mlx1013-rates-dock svg{width:18px!important;height:18px!important;}
 html body.mlx101-ui #app .sidebar .mlx1013-rates-dock span{display:none!important;}
}
@media(prefers-reduced-motion:reduce){html body.mlx101-ui #app .sidebar .mlx1013-rates-dock{transition:none!important;transform:none!important;}}
}
</style>
<script id="mlx1013-bottom-rates-js">
(()=>{'use strict';
const ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>';
function openRates(){
 if(typeof window.mlx108OpenRates==='function'){window.mlx108OpenRates();return;}
 const old=document.querySelector('#nav button[data-page="ratelist"]'); if(old)old.click();
}
function mount(){
 const sidebar=document.querySelector('#app .sidebar');if(!sidebar)return;
 if(sidebar.querySelector('#mlx1013RatesDock'))return;
 const button=document.createElement('button');button.type='button';button.id='mlx1013RatesDock';button.className='mlx1013-rates-dock';
 button.innerHTML=ICON+'<span>Rate List</span>';
 button.title='Open Radiology Tests & Rates';button.setAttribute('aria-label','Open Radiology Rate List');
 button.addEventListener('click',openRates);
 const foot=sidebar.querySelector('.sidebar-foot'); if(foot)sidebar.insertBefore(button,foot);else sidebar.appendChild(button);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount,{once:true});else mount();
})();
</script>
