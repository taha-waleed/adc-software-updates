name: Publish MediLab X 10.2.1 - Text Contrast and UI Polish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-ui-10-2-1.yml
      - m/publish_ui_10_2_1.py
      - m/pearl-10.2.1-contrast.css
      - m/pearl-10.2.1-icons.js
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medilabx-ui-10-2-1
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate 10.2.0 source and build strictly additive UI hotfix
        run: python3 m/publish_ui_10_2_1.py
      - name: Commit verified HTML and update manifest
        run: |
          git config user.name "medilab-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medilabx-ui-10.2.1/MediLabX.html m/update.json
          if ! git diff --cached --quiet; then
            git commit -m "MediLab X 10.2.1 fix sidebar labels, Settings icons and notification compactness"
            git push
          fi
