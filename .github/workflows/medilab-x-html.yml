name: MediLab X - Publish HTML and Update JSON
on:
  push:
    branches: [main]
    paths:
      - 'medilab-x/html-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medilab-x-html
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate standalone HTML and manifest
        run: python3 medilab-x/publish_html.py
      - name: Commit and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add medilab-x/MediLab_X_10_0_11.html medilab-x/update.json
          if ! git diff --cached --quiet; then
            git commit -m 'MediLab X 10.0.11: publish HTML-only update'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
