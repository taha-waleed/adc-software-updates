name: Publish MediLab X 10.4.11 — Single Update Dialog Fix
on:
  push:
    branches: [main]
    paths:
      - m/ux-10.4.11.css.z64
      - m/ux-10.4.11.js.z64
      - m/build_ui_10_4_11.py
      - .github/workflows/publish-ui-10-4-11.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medilabx-html-10411
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build against pinned release and manifest (fail closed on mismatch)
        run: python3 m/build_ui_10_4_11.py
      - name: Commit verified HTML and official SHA256 manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "medilab-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medilabx-ui-10.4.11/MediLabX.html m/update.json
          if ! git diff --cached --quiet; then
            git commit -m "MediLab X 10.4.11: one native updater confirmation and tidy buttons"
            git push origin HEAD:main
          fi
