name: MediLab X Native WPF Compile Check
on:
  push:
    branches:
      - feature/medilab-x-native-wpf
    paths:
      - 'medilab-x/native-wpf/**'
      - '.github/workflows/native-wpf-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore medilab-x/native-wpf/src/MediLabX.Native/MediLabX.Native.csproj
      - name: Compile native Windows desktop app
        run: dotnet build medilab-x/native-wpf/src/MediLabX.Native/MediLabX.Native.csproj -c Release --no-restore -warnaserror
      - name: Publish Windows alpha (not production installer)
        run: dotnet publish medilab-x/native-wpf/src/MediLabX.Native/MediLabX.Native.csproj -c Release -r win-x64 --self-contained false --no-restore -o medilab-x/native-wpf/publish
      - uses: actions/upload-artifact@v4
        with:
          name: MediLabX-NativeWpf-alpha-win64
          path: medilab-x/native-wpf/publish/
          retention-days: 7