name: Publish MediLab X 10.0.7 - Mini Fish Tank Taskbar
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-ui-10-0-7.yml
      - m/publish_ui_10_0_7.py
      - m/ux-10.0.7.patch.b64
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medilabx-ui-10-0-7
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 10.0.6 and assemble additive Fish Tank release
        run: python3 m/publish_ui_10_0_7.py
      - name: Commit verified release HTML and update manifest
        run: |
          git config user.name "medilab-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medilabx-ui-10.0.7/MediLabX.html m/update.json
          if ! git diff --cached --quiet; then
            git commit -m "MediLab X 10.0.7 miniature Fish Tank taskbar and integrated settings"
            git push
          fi
