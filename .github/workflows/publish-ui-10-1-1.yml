name: Publish MediLab X 10.1.1 - Square Sidebar and Rate List
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-ui-10-1-1.yml
      - m/publish_ui_10_1_1.py
      - m/ux-10.1.1-addon.html
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medilabx-ui-10-1-1
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 10.1 source and generate scoped 10.1.1 HTML patch
        run: python3 m/publish_ui_10_1_1.py
      - name: Publish verified HTML and manifest
        run: |
          git config user.name "medilab-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medilabx-ui-10.1.1/MediLabX.html m/update.json
          if ! git diff --cached --quiet; then
            git commit -m "MediLab X 10.1.1 square sidebar and restore visible Rate List"
            git push
          fi
