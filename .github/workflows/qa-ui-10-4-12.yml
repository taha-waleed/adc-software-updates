name: MediLab X 10.4.12 — Compact Reception & Version QA
on:
  pull_request:
    branches: [main]
    paths:
      - m/ux-10.4.12.css.z64
      - m/ux-10.4.12.js.z64
      - m/build_ui_10_4_12.py
      - m/qa_10_4_12.cjs
      - .github/workflows/qa-ui-10-4-12.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build release from SHA-verified existing 10.4.11 clinical HTML
        run: python3 m/build_ui_10_4_12.py --qa --qa-output /tmp/MediLabX-10.4.12-QA.html
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Test all 10.4.12 UI changes, Light and Dark modes
        run: node m/qa_10_4_12.cjs /tmp/MediLabX-10.4.12-QA.html
