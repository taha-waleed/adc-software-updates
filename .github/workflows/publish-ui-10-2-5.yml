name: Publish MediLab X 10.2.5 - Single Updates UI
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-ui-10-2-5.yml
      - m/publish_ui_10_2_5.py
      - m/ux-10.2.5-single-update.css
      - m/ux-10.2.5-single-update.js
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medilabx-ui-10-2-5
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild verified 10.2.5 HTML and manifest
        run: python3 m/publish_ui_10_2_5.py
      - name: Publish HTML with matching SHA-256 update manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "medilab-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medilabx-ui-10.2.5/MediLabX.html m/update.json
          if ! git diff --cached --quiet; then
            git commit -m "MediLab X 10.2.5: single update panel and correct status display"
            git push origin HEAD:main
          fi
