name: Publish MediLab X 10.0.9 - Simplified Cash Summary
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-ui-10-0-9.yml
      - m/publish_ui_10_0_9.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medilabx-ui-10-0-9
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify 10.0.8 HTML and generate narrow 10.0.9 UI patch
        run: python3 m/publish_ui_10_0_9.py
      - name: Publish release and SHA-256 update manifest
        run: |
          git config user.name "medilab-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medilabx-ui-10.0.9/MediLabX.html m/update.json
          if ! git diff --cached --quiet; then
            git commit -m "MediLab X 10.0.9 remove Departments cash chart toggle"
            git push
          fi
