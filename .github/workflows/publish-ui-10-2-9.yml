name: Publish MediLab X 10.2.9 - Restored UI Settings and Admin
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-ui-10-2-9.yml
      - m/publish_ui_10_2_9.py
      - m/ux-10.2.9-legacy-settings-admin.css
      - m/ux-10.2.9-legacy-settings-admin.js
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medilabx-ui-10-2-9
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original 10.1.4 clinical code and compile 10.2.9 release
        run: python3 m/publish_ui_10_2_9.py
      - name: Publish verified HTML plus SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "medilab-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medilabx-ui-10.2.9/MediLabX.html m/update.json
          if ! git diff --cached --quiet; then
            git commit -m "MediLab X 10.2.9: 10.1.4 with redesigned Settings and Admin"
            git push origin HEAD:main
          fi
