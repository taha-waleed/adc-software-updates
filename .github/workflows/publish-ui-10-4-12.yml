name: Publish MediLab X 10.4.12 — Compact Reception Fix
on:
  push:
    branches: [main]
    paths:
      - m/ux-10.4.12.css.z64
      - m/ux-10.4.12.js.z64
      - m/build_ui_10_4_12.py
      - .github/workflows/publish-ui-10-4-12.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medilabx-html-10412
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate base source and update manifest, build official 10.4.12
        run: python3 m/build_ui_10_4_12.py
      - name: Commit HTML and SHA-256 verified update.json
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "medilab-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medilabx-ui-10.4.12/MediLabX.html m/update.json
          if ! git diff --cached --quiet; then
            git commit -m "MediLab X 10.4.12: compact tests and single version labels"
            git push origin HEAD:main
          fi
