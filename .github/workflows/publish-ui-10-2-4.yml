name: Publish MediLab X 10.2.4 - Settings and Admin Cleanup
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-ui-10-2-4.yml
      - m/publish_ui_10_2_4.py
      - m/ux-10.2.4-cleanup.css
      - m/ux-10.2.4-cleanup.js
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medilabx-ui-10-2-4
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source checksum, clinical element IDs and UI code, then build
        run: python3 m/publish_ui_10_2_4.py
      - name: Publish complete release and SHA256 manifest atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "medilab-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medilabx-ui-10.2.4/MediLabX.html m/update.json
          if ! git diff --cached --quiet; then
            git commit -m "MediLab X 10.2.4: remove duplicate update sections, date and Admin fixes"
            git push origin HEAD:main
          fi
