name: Publish MediLab X 10.1 - Unified Duo-Tone
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-ui-10-1.yml
      - m/publish_ui_10_1.py
      - m/ux-10.1.patch.b64
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medilabx-ui-10-1
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 10.0.10 release and build additive Duo-Tone 10.1
        run: python3 m/publish_ui_10_1.py
      - name: Publish HTML and verified update manifest
        run: |
          git config user.name "medilab-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medilabx-ui-10.1.0/MediLabX.html m/update.json
          if ! git diff --cached --quiet; then
            git commit -m "MediLab X 10.1 unified Light/Dark Duo-Tone and classic sidebar"
            git push
          fi
