name: Publish MediLab X 10.2.7 - Navy Taskbar and Privacy
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-ui-10-2-7.yml
      - m/publish_ui_10_2_7.py
      - m/ux-10.2.7-navy-privacy.css
      - m/ux-10.2.7-navy-privacy.js
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medilabx-ui-10-2-7
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify baseline, native controls and compile verified release
        run: python3 m/publish_ui_10_2_7.py
      - name: Publish signed-off release HTML and SHA256 update manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "medilab-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medilabx-ui-10.2.7/MediLabX.html m/update.json
          if ! git diff --cached --quiet; then
            git commit -m "MediLab X 10.2.7: animated privacy and navy taskbar"
            git push origin HEAD:main
          fi
