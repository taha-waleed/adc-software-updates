name: Publish MediLab X 10.2.11 — Restore Archived 10.1.4
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-ui-10-2-11.yml
      - m/publish_ui_10_2_11_emergency_restore.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medilabx-ui-10-2-11-restore
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate archived clinical source and compile unchanged original UI
        run: python3 m/publish_ui_10_2_11_emergency_restore.py
      - name: Publish versioned HTML and matching SHA256 manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "medilab-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medilabx-ui-10.2.11/MediLabX.html m/update.json
          if ! git diff --cached --quiet; then
            git commit -m "Emergency MediLab X 10.2.11: restore exact original 10.1.4 interface"
            git push origin HEAD:main
          fi
