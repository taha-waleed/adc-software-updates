name: MediLab X Original UI Windows Preview (WPF WebView2)
on:
  push:
    branches:
      - feature/medilab-x-original-ui-webview
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medilab-original-ui-windows
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Embed the exact approved MediLab X HTML 10.0.11
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $target='medilab-x/original-ui-webview/src/MediLabX.Desktop/assets'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          # Rebuild from versioned verified base and source assets, avoiding malformed published HTML.
          python medilab-x/publish_html.py
          if($LASTEXITCODE -ne 0){throw 'Safe HTML generation failed'}
          $src='medilab-x/MediLab_X_10_0_11.html'
          Copy-Item $src "$target/index.html" -Force
          $sha=(Get-FileHash "$target/index.html" -Algorithm SHA256).Hash.ToLowerInvariant()
          $want=(Get-Content 'medilab-x/update.json' -Raw|ConvertFrom-Json).htmlSha256
          if($sha -ne $want){throw "Generated HTML SHA-256 mismatch: $sha" }
          Write-Host 'PASS: standalone HTML regenerated safely and SHA-256 verified'
          Copy-Item 'medilab-x/current/kharian-referring-directory.json' "$target/kharian-referring-directory.json" -Force
          Get-ChildItem -Path 'medilab-x/current' -File | Where-Object { $_.Extension -in @('.css', '.js') } | ForEach-Object { Copy-Item $_.FullName (Join-Path $target $_.Name) -Force }
          # Make verified UI self-contained: load visual polish before auth scripts run.
          $html=[IO.File]::ReadAllText((Join-Path (Get-Location) "$target/index.html"))
          $head=$html.LastIndexOf('</head>',[StringComparison]::OrdinalIgnoreCase)
          if($head -lt 0){throw 'Original HTML closing head not found'}
          $skin='<link rel="stylesheet" href="/medilab-login-v031.css" id="ml031-stylesheet"><script defer src="/medilab-login-v031.js" id="ml031-script"></script>'
          [IO.File]::WriteAllText((Join-Path (Get-Location) "$target/index.html"),$html.Insert($head,$skin),[Text.UTF8Encoding]::new($false))
          Write-Host 'PASS: Original MediLab UI + bundled login skin'
          python medilab-x/original-ui-webview/tools/validate_inline_scripts.py "$target/index.html"
          if($LASTEXITCODE -ne 0){throw 'HTML JavaScript verification failed; native release blocked'}
          Write-Host 'PASS: Approved UI asset integrity verified'
      - name: Restore and build Windows WPF with WebView2
        shell: pwsh
        run: |
          $p='medilab-x/original-ui-webview/src/MediLabX.Desktop/MediLabX.Desktop.csproj'
          dotnet restore $p -r win-x64
          if($LASTEXITCODE -ne 0){throw 'Restore failed'}
          dotnet build $p -c Release -r win-x64 --no-restore -warnaserror
          if($LASTEXITCODE -ne 0){throw 'Compilation failed'}
      - name: Publish self-contained win-x64 app
        shell: pwsh
        run: |
          $p='medilab-x/original-ui-webview/src/MediLabX.Desktop/MediLabX.Desktop.csproj'
          dotnet publish $p -c Release -r win-x64 --self-contained true --no-restore -p:PublishTrimmed=false -o medilab-x/original-ui-webview/publish
          if($LASTEXITCODE -ne 0){throw 'Publish failed'}
          if(-not (Test-Path 'medilab-x/original-ui-webview/publish/MediLabX.Desktop.exe')){throw 'EXE missing'}
          if(-not (Test-Path 'medilab-x/original-ui-webview/publish/assets/index.html')){throw 'HTML asset missing'}
      - name: Launch real EXE and verify browser DOM
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Resolve-Path 'medilab-x/original-ui-webview/publish/MediLabX.Desktop.exe').Path
          $log=Join-Path $env:APPDATA 'MediLab/Standard/OriginalUIHost/logs/startup.log'
          if(Test-Path $log){Remove-Item $log -Force}
          $env:MEDILAB_UI_LOGIN_SMOKE='1'
          $process=Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe -Parent) -PassThru
          try {
            Start-Sleep -Seconds 20
            $process.Refresh()
            $data=if(Test-Path $log){Get-Content $log -Raw}else{'<no startup log>'}
            Write-Host 'STARTUP LOG:'
            Write-Host $data
            if($process.HasExited){throw "EXE exited unexpectedly with code $($process.ExitCode)"}
            if($data -notmatch 'Original MediLab UI rendered; native bridge injected'){
              throw 'Original MediLab HTML did not render inside WPF host'
            }
            if($data -notmatch 'PASS: login to dashboard; no splash reset; heartbeat logo loaded'){
              throw 'Actual login→dashboard smoke test failed; do not publish broken ZIP'
            }
            $process.Refresh()
            if($process.MainWindowHandle -eq 0){throw 'Visible Windows application handle missing'}
            Write-Host "PASS: Login→dashboard verified in Windows WPF WebView2. Handle $($process.MainWindowHandle)"
          }
          finally {if(-not $process.HasExited){Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue}}
      - name: Verify login to dashboard (test-only synthetic account)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $file='medilab-x/original-ui-webview/publish/assets/index.html'
          $backup='medilab-x/original-ui-webview/publish/assets/index.ci-original'
          Copy-Item $file $backup -Force
          $snippet=@'
          <script id="mx031-ci-login-probe">
          (() => {
           function run(){
             const key='ahdc_software_v1';
             let record={};try{record=JSON.parse(localStorage.getItem(key)||'{}')}catch{}
             const existing=Array.isArray(record.users)&&record.users.length?record.users[0]:{name:'Admin',username:'Admin',role:'admin'};
             existing.password='local-test-12345';
             record.users=[existing];
             localStorage.setItem(key,JSON.stringify(record));
             setTimeout(()=>{
               const tile=[...document.querySelectorAll('#adcUserTiles .adc-profile-tile')][0];
               if(tile)tile.click();
               const u=document.getElementById('loginUser'),p=document.getElementById('loginPass'),f=document.getElementById('loginForm');
               if(u&&p&&f){u.value=existing.username;p.value='local-test-12345';f.requestSubmit();}
             },1400);
             setTimeout(()=>{
               const ok=!!document.querySelector('#app.authenticated');
               window.adcDesktop?.clientDiagnostic?.(ok?'ci-auth-pass':'ci-auth-fail');
             },6500);
           }
           if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run,{once:true});else run();
          })();
          </script>
          '@
          $html=[IO.File]::ReadAllText((Join-Path (Get-Location) $file))
          if(-not $html.Contains('</body>')){throw 'Original HTML has no closing body tag'}
          $finalBody=$html.LastIndexOf('</body>',[StringComparison]::OrdinalIgnoreCase)
          if($finalBody -lt 0){throw 'Could not locate final HTML closing body'}
          [IO.File]::WriteAllText((Join-Path (Get-Location) $file),$html.Insert($finalBody,$snippet),[Text.UTF8Encoding]::new($false))
          $profile=Join-Path $env:APPDATA 'MediLab/Standard/OriginalUIHost'
          $index=Join-Path $profile 'ui/index.html'
          if(Test-Path $index){Remove-Item $index -Force}
          $log=Join-Path $profile 'logs/startup.log'
          if(Test-Path $log){Remove-Item $log -Force}
          $exe=(Resolve-Path 'medilab-x/original-ui-webview/publish/MediLabX.Desktop.exe').Path
          $process=Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe -Parent) -PassThru
          try{
            Start-Sleep -Seconds 18
            $body=if(Test-Path $log){Get-Content $log -Raw}else{'<log not created>'}
            Write-Host 'LOGIN SMOKE TEST:'
            Write-Host $body
            if($body -notmatch 'UI: ci-auth-pass'){throw 'Login did not reach authenticated dashboard; do not publish'}
            if($body -match 'UI: ci-auth-fail'){throw 'Login flow returned to entry screen'}
            Write-Host 'PASS: Original login form opens authenticated dashboard without restarting splash'
          } finally {
            if(-not $process.HasExited){Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue}
            Copy-Item $backup $file -Force
            Remove-Item $backup -Force
          }
      - name: Package preview ZIP and checksum
        shell: pwsh
        run: |
          $dist='medilab-x/original-ui-webview/dist'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          $zip="$dist/MediLabX-OriginalUI-Windows-0.3.1-Preview-x64.zip"
          Compress-Archive -Path 'medilab-x/original-ui-webview/publish/*' -DestinationPath $zip -CompressionLevel Optimal -Force
          $sha=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content "$dist/SHA256SUMS.txt" "$sha  MediLabX-OriginalUI-Windows-0.3.1-Preview-x64.zip"
          Write-Host "SHA256 $sha"
      - name: Upload preview build files
        uses: actions/upload-artifact@v4
        with:
          name: MediLabX-OriginalUI-Windows-0.3.1
          path: medilab-x/original-ui-webview/dist/*
          retention-days: 10
      - name: Publish independent prerelease (never modify production update.json)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          $tag='medilab-x-original-ui-preview-v0.3.1'
          $repo='${{ github.repository }}'
          $zip='medilab-x/original-ui-webview/dist/MediLabX-OriginalUI-Windows-0.3.1-Preview-x64.zip'
          $hash='medilab-x/original-ui-webview/dist/SHA256SUMS.txt'
          gh release view $tag --repo $repo *> $null
          if($LASTEXITCODE -ne 0){
            gh release create $tag $zip $hash --prerelease --repo $repo --title 'MediLab X 0.3.1 — Original UI Desktop Preview' --notes 'WPF WebView2 host for the exact approved 10.0.11 standalone HTML (SHA-256 pinned). Includes Windows window controls, print preview, WhatsApp Desktop and checksum-verified future HTML updates. Separate profile and local data. Does not replace the live Electron software. Windows-launch-tested preview, NOT a production clinical release.'
          }else{
            gh release upload $tag $zip $hash --clobber --repo $repo
          }
          if($LASTEXITCODE -ne 0){throw 'GitHub preview release upload failed'}