name: MediLab X 10.4.8 — Settings and Theme QA
on:
  pull_request:
    branches: [main]
    paths:
      - m/ux-10.4.8-settings-contrast.css.z64
      - m/ux-10.4.8-settings-audit.js.z64
      - m/build_ui_10_4_8.py
      - m/qa_10_4_8.cjs
      - .github/workflows/qa-ui-10-4-8.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify official 10.4.7 SHA-256 and build 10.4.8 QA HTML
        run: python3 m/build_ui_10_4_8.py --qa --qa-output /tmp/MediLabX-10.4.8-QA.html
      - name: Install browser QA
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Validate every supported Settings category and UI contrast
        run: node m/qa_10_4_8.cjs /tmp/MediLabX-10.4.8-QA.html /tmp/medilabx-1048-qa
      - name: Store Light/Dark screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MediLabX-10.4.8-Settings-Contrast-QA
          path: /tmp/medilabx-1048-qa
          if-no-files-found: ignore
          retention-days: 14
