name: Publish MediLab X 10.1.2 - Unified Professional UI
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-ui-10-1-2.yml
      - m/publish_ui_10_1_2.py
      - m/ux-10.1.2-addon.html
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medilabx-ui-10-1-2
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify 10.1.1 and publish CSS-only professional 10.1.2
        run: python3 m/publish_ui_10_1_2.py
      - name: Commit additive HTML and SHA-256 manifest
        run: |
          git config user.name "medilab-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medilabx-ui-10.1.2/MediLabX.html m/update.json
          if ! git diff --cached --quiet; then
            git commit -m "MediLab X 10.1.2 unified Light Dark contrast and professional motion"
            git push
          fi
