name: Publish MediLab X 10.2 - Pearl Clinical
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-ui-10-2.yml
      - m/publish_ui_10_2.py
      - m/pearl-10.2.0-theme.css
      - m/pearl-10.2.0-activate.js
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medilabx-ui-10-2
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate original application source and build 10.2 Pearl Clinical
        run: python3 m/publish_ui_10_2.py
      - name: Publish versioned HTML and matching SHA-256 manifest
        run: |
          git config user.name "medilab-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medilabx-ui-10.2.0/MediLabX.html m/update.json
          if ! git diff --cached --quiet; then
            git commit -m "MediLab X 10.2 Pearl Clinical Light Dark professional UI"
            git push
          fi
