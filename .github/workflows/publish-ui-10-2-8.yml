name: Publish MediLab X 10.2.8 - Restore Original 10.1.4
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-ui-10-2-8.yml
      - m/publish_ui_10_2_8_restore_10_1_4.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medilab-x-10-2-8-restore
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify legacy release checksum, matching DB implementation and exact copy
        run: python3 m/publish_ui_10_2_8_restore_10_1_4.py
      - name: Confirm released HTML is byte-identical to archived original
        run: cmp -s medilabx-ui-10.1.4/MediLabX.html medilabx-ui-10.2.8/MediLabX.html
      - name: Publish legacy HTML with monotonically increasing manifest version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "medilab-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medilabx-ui-10.2.8/MediLabX.html m/update.json
          if ! git diff --cached --quiet; then
            git commit -m "MediLab X 10.2.8: restore exact original 10.1.4 software"
            git push origin HEAD:main
          fi
