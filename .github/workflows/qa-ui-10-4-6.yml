name: MediLab X 10.4.6 — Navbar/Buttons Production QA
on:
  pull_request:
    branches: [main]
    paths:
      - m/ux-10.4.6-navy.css.z64
      - m/ux-10.4.6-tabs.js.z64
      - m/build_ui_10_4_6.py
      - m/qa_10_4_6.cjs
      - .github/workflows/qa-ui-10-4-6.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate verified production 10.4.6 HTML fixture
        run: python3 m/build_ui_10_4_6.py --qa --qa-output /tmp/MediLabX-10.4.6-QA.html
      - name: Install Chromium QA dependency
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Check navy top/left bar equality, buttons, dark/light, tabs and printing
        run: node m/qa_10_4_6.cjs /tmp/MediLabX-10.4.6-QA.html /tmp/medilabx-1046-qa
      - name: Upload browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MediLab-X-10.4.6-Navy-UI-QA
          path: /tmp/medilabx-1046-qa
          if-no-files-found: ignore
          retention-days: 14
