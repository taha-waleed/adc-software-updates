name: Publish MediLab X 10.4.8 — Settings Theme Fix
on:
  push:
    branches: [main]
    paths:
      - m/ux-10.4.8-settings-contrast.css.z64
      - m/ux-10.4.8-settings-audit.js.z64
      - m/build_ui_10_4_8.py
      - .github/workflows/publish-ui-10-4-8.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medilabx-html-1048
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build only if 10.4.7 clinical source and update manifest match pinned SHA
        run: python3 m/build_ui_10_4_8.py
      - name: Publish 10.4.8 HTML and verified update.json
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "medilab-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medilabx-ui-10.4.8/MediLabX.html m/update.json
          if ! git diff --cached --quiet; then
            git commit -m "MediLab X 10.4.8: sidebar selection, settings audit, dark-light UI"
            git push origin HEAD:main
          fi
