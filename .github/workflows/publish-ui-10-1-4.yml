name: Publish MediLab X 10.1.4 - Interactive Glass Notifications
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-ui-10-1-4.yml
      - m/publish_ui_10_1_4.py
      - m/ux-10.1.4-notifications.json
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medilabx-ui-10-1-4
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source and assemble tested notification changes
        run: python3 m/publish_ui_10_1_4.py
      - name: Publish versioned HTML and SHA-256 update manifest
        run: |
          git config user.name "medilab-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medilabx-ui-10.1.4/MediLabX.html m/update.json
          if ! git diff --cached --quiet; then
            git commit -m "MediLab X 10.1.4 interactive glass notifications and dated history"
            git push
          fi
