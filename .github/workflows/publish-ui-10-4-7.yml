name: Publish MediLab X 10.4.7 — HR and Settings Update
on:
  push:
    branches: [main]
    paths:
      - m/patch_core_10_4_7.py.z64
      - m/ux-10.4.7.css.z64
      - m/ux-10.4.7.js.z64
      - m/build_ui_10_4_7.py
      - .github/workflows/publish-ui-10-4-7.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medilabx-html-1047
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 10.4.6 production source and build 10.4.7 HTML + SHA256 manifest
        run: python3 m/build_ui_10_4_7.py
      - name: Commit official update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "medilab-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medilabx-ui-10.4.7/MediLabX.html m/update.json
          if ! git diff --cached --quiet; then
            git commit -m "MediLab X 10.4.7: embedded employee management, CNIC, Settings welcome"
            git push origin HEAD:main
          fi
