name: Publish MediLab X 10.2.3 - Reference Theme and Settings
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-ui-10-2-3.yml
      - m/publish_ui_10_2_3.py
      - medilabx-ui-10.2.3/MediLabX.html
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medilabx-ui-10-2-3
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify intact clinical source, theme JavaScript and SHA256
        run: python3 m/publish_ui_10_2_3.py
      - name: Publish verified 10.2.3 update manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "medilab-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add m/update.json
          if ! git diff --cached --quiet; then
            git commit -m "MediLab X 10.2.3: publish verified reference theme update"
            git push
          fi
