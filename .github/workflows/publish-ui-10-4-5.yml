name: Publish MediLab X 10.4.5 — Official HTML Update
on:
  push:
    branches: [main]
    paths:
      - m/ux-10.4.5-unified.css.z64
      - m/ux-10.4.5-unified.js.z64
      - m/build_ui_10_4_5.py
      - .github/workflows/publish-ui-10-4-5.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medilabx-html-1045
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build 10.4.5 HTML using verified 10.4.0 medical UI source
        run: python3 m/build_ui_10_4_5.py
      - name: Commit release and official SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "medilab-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medilabx-ui-10.4.5/MediLabX.html m/update.json
          if ! git diff --cached --quiet; then
            git commit -m "MediLab X 10.4.5: unified minimal UI and Doctors/Rate List sections"
            git push origin HEAD:main
          fi
