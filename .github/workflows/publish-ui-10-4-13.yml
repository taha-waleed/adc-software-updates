name: Publish MediLab X 10.4.13 — Header Filters
on:
  push:
    branches: [main]
    paths:
      - m/ux-10.4.13.css.z64
      - m/ux-10.4.13.js.z64
      - m/build_ui_10_4_13.py
      - .github/workflows/publish-ui-10-4-13.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medilabx-html-10413
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original source SHA256 and release manifest then build 10.4.13
        run: python3 m/build_ui_10_4_13.py
      - name: Commit release HTML and SHA256 update manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "medilab-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medilabx-ui-10.4.13/MediLabX.html m/update.json
          if ! git diff --cached --quiet; then
            git commit -m "MediLab X 10.4.13: Reception filters aligned with Add tests heading"
            git push origin HEAD:main
          fi
