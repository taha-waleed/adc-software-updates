name: Publish MediLab X 10.0.5 — Fixed Workspaces
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-ui-10-0-5.yml
      - m/publish_ui_10_0_5.py
      - m/ui-10.0.5.b64
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medilabx-ui-10-0-5
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 10.0.4 and generate additive 10.0.5 HTML
        run: python3 m/publish_ui_10_0_5.py
      - name: Publish verified HTML and manifest in one commit
        run: |
          git config user.name "medilab-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medilabx-ui-10.0.5/MediLabX.html m/update.json
          # Original HTML has historical trailing whitespace; checksum and exact-source checks run above.
          if ! git diff --cached --quiet; then
            git commit -m "MediLab X 10.0.5 fixed Settings/Admin UI and Developer Ctrl+D"
            git push
          fi
