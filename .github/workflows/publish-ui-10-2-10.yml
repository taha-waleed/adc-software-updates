name: Publish MediLab X 10.2.10 — Unified V11 Theme
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-ui-10-2-10.yml
      - m/publish_ui_10_2_10.py
      - m/ux-10.2.10-v11-unified.css
      - m/ux-10.2.10-v11-unified.js
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medilabx-ui-10-2-10
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify unchanged clinical base and create SHA256 release
        run: python3 m/publish_ui_10_2_10.py
      - name: Publish complete HTML and matching real update manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "medilab-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medilabx-ui-10.2.10/MediLabX.html m/update.json
          if ! git diff --cached --quiet; then
            git commit -m "MediLab X 10.2.10: apply V11 unified theme and animated privacy"
            git push origin HEAD:main
          fi
