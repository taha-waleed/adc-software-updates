name: Publish MediLab X 10.4.6 — Navy Theme
on:
  push:
    branches: [main]
    paths:
      - m/ux-10.4.6-navy.css.z64
      - m/ux-10.4.6-tabs.js.z64
      - m/build_ui_10_4_6.py
      - .github/workflows/publish-ui-10-4-6.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medilabx-html-1046
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify previous source and build MediLab X 10.4.6 HTML
        run: python3 m/build_ui_10_4_6.py
      - name: Commit HTML and SHA-256 verified update.json
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "medilab-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medilabx-ui-10.4.6/MediLabX.html m/update.json
          if ! git diff --cached --quiet; then
            git commit -m "MediLab X 10.4.6: matching navy titlebar/sidebar and modern buttons"
            git push origin HEAD:main
          fi
