name: MediLab X 10.2.6 - Pre-Release Browser QA
on:
  pull_request:
    branches: [main]
    paths:
      - m/publish_ui_10_2_6.py
      - m/ux-10.2.6-workspace.css
      - m/ux-10.2.6-workspace.js
      - m/qa_10_2_6.cjs
      - .github/workflows/qa-ui-10-2-6.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build checksum-pinned HTML fixture without touching update manifest
        run: python3 m/publish_ui_10_2_6.py --qa --qa-output /tmp/MediLabX-10.2.6-QA.html
      - name: Install Chromium test dependency
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Render and test three viewport sizes, Light/Dark dialogs, real Settings navigation
        run: node m/qa_10_2_6.cjs /tmp/MediLabX-10.2.6-QA.html /tmp/medilab-x-qa
      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medilab-x-10-2-6-qa-screenshots
          path: /tmp/medilab-x-qa/
          if-no-files-found: ignore
          retention-days: 14
