name: Publish MediLab X 10.2.6 - Professional Workspace
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-ui-10-2-6.yml
      - m/publish_ui_10_2_6.py
      - m/ux-10.2.6-workspace.css
      - m/ux-10.2.6-workspace.js
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medilabx-ui-10-2-6
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate pinned 10.2.5 baseline, original handlers, JavaScript, build manifest
        run: python3 m/publish_ui_10_2_6.py
      - name: Commit verified HTML and matching SHA256 manifest to official channel
        run: |
          set -euo pipefail
          git config user.name "medilab-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medilabx-ui-10.2.6/MediLabX.html m/update.json
          if ! git diff --cached --quiet; then
            git commit -m "MediLab X 10.2.6: polished Settings/Admin, icons and dialogs"
            git push origin HEAD:main
          fi
