name: Publish MediLab X 10.0.8 - Radiology and Test Analytics
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-ui-10-0-8.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medilabx-ui-10-0-8
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 10.0.7 source and build separate 10.0.8
        run: python3 m/publish_ui_10_0_8.py
      - name: Publish HTML and SHA-256 manifest atomically
        run: |
          git config user.name "medilab-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medilabx-ui-10.0.8/MediLabX.html m/update.json
          if ! git diff --cached --quiet; then
            git commit -m "MediLab X 10.0.8 Radiology Rate List and test analytics"
            git push
          fi
