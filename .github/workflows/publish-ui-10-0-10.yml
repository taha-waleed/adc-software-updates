name: Publish MediLab X 10.0.10 - Floating Taskbar and Notification Fix
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-ui-10-0-10.yml
      - m/publish_ui_10_0_10.py
      - m/ux-10.0.10.patch.b64
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medilabx-ui-10-0-10
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 10.0.9 and build additive 10.0.10 release
        run: python3 m/publish_ui_10_0_10.py
      - name: Commit HTML release and matching update.json
        run: |
          git config user.name "medilab-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medilabx-ui-10.0.10/MediLabX.html m/update.json
          if ! git diff --cached --quiet; then
            git commit -m "MediLab X 10.0.10 floating taskbar, Carbon Pro and visible notifications"
            git push
          fi
