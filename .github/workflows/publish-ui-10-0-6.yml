name: Publish MediLab X 10.0.6 - Patient validation and Doctor Directory
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-ui-10-0-6.yml
      - m/ux-10.0.6.patch.b64
      - m/publish_ui_10_0_6.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: medilabx-ui-10-0-6
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and stage additive HTML release
        run: python3 m/publish_ui_10_0_6.py
      - name: Publish new HTML and verified update manifest
        run: |
          git config user.name "medilab-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medilabx-ui-10.0.6/MediLabX.html m/update.json
          if ! git diff --cached --quiet; then
            git commit -m "MediLab X 10.0.6 required age/gender, Self, doctor dialog, close confirmation"
            git push
          fi
