name: MediLab X 10.2.7 - Pre-Release Privacy and Settings QA
on:
  pull_request:
    branches: [main]
    paths:
      - m/publish_ui_10_2_7.py
      - m/ux-10.2.7-navy-privacy.css
      - m/ux-10.2.7-navy-privacy.js
      - m/qa_10_2_7.cjs
      - .github/workflows/qa-ui-10-2-7.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build standalone source from SHA256-pinned 10.2.6
        run: python3 m/publish_ui_10_2_7.py --qa --qa-output /tmp/MediLabX-10.2.7-QA.html
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Test Settings tabs, taskbar colour, privacy presets, Escape unlock and responsive widths
        run: node m/qa_10_2_7.cjs /tmp/MediLabX-10.2.7-QA.html /tmp/medilab-x-1027-screens
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medilab-x-10-2-7-qa
          path: /tmp/medilab-x-1027-screens/
          if-no-files-found: ignore
          retention-days: 14
